<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .temp-container {
            max-width: 400px;
            min-width: 200px;
            margin: 0 20px;
            padding: 20px;
            border: 1px solid grey;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        select, input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border-radius: 4px;
            border: 0.5px solid black;
        }
        
        button {
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .calculate-button {
            width: 100%;
            padding: 10px 0;
            background-color: rgb(132, 132, 247);
            color: white;
            font-weight: bold;
        }
        
        header {
            font-weight: bold;
            font-size: 35px;
        }

        #result {
            background-color: aliceblue;
            height: 40px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #modal {
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            display: none;
        }

        #modal > div {
            height: 200px;
            width: 400px;
            background-color: white;
        }

        #message {
            margin-top: 40px;
            text-align: center;
        }

    </style>
    
    <div class="temp-container">
        <header>Temperature Converter</header>
        <div>
            <div>Initial Unit</div>
            <select id="initial-unit">
                <option value="c">Celsius</option>
                <option value="f">Fahrenheit</option>
                <option value="k">Kelvin</option>
            </select>
        </div>
        <div>
            <div>Input Temperature value</div>
            <input type="number" id="temp-value" placeholder="Input a temperature" />
        </div>
        <div>
            <div>Unit to convert to</div>
            <select id="subsequent-unit">
                <option value="c">Celsius</option>
                <option value="f">Fahrenheit</option>
                <option value="k">Kelvin</option>
            </select>
        </div>
        <div id="result">Display Result</div>
        <div>
            <button class="calculate-button">Calculate</button>
        </div>
    </div>

    <div id="modal">
        <div>
            <div style="text-align: right; padding: 10px;">
                <button id="close">Close</button>
            </div>
            <div id="message">Message</div>
        </div>
    </div>

    <script>
        const initialUnit = document.querySelector("#initial-unit");
        const tempValue = document.querySelector("#temp-value");
        const subsequentUnit = document.querySelector("#subsequent-unit");
        const display = document.querySelector("#result");
        const calculateButton = document.querySelector(".calculate-button");

        const modal = document.querySelector("#modal");
        const message = document.querySelector("#message");
        const closeButton = document.querySelector("#close");

        closeButton.addEventListener("click", function () {
            modal.style.display = "none";
        });

        function calculateFunction() {

            if(initialUnit.value == subsequentUnit.value) {
                message.innerText = "The initial and subsequent units should not be the same";
                modal.style.display = "flex";
                return;
            }

            if(!tempValue.value) {
                message.innerText = "No temperature value entered";
                modal.style.display = "flex";
                return;
            }

            if(initialUnit.value === "c" && subsequentUnit.value === "f") {
                const fahrenheitValue = (Number(tempValue.value) * 1.8) + 32;
                display.innerText = fahrenheitValue;
            }

            if(initialUnit.value === "c" && subsequentUnit.value === "k") {
                const kelvinValue = Number(tempValue.value) + 273.15;
                display.innerText = kelvinValue;
            }

        }


        calculateButton.addEventListener("click", calculateFunction);

    </script>

</body>
</html>
