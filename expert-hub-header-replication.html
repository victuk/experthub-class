<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="shortcut icon" href="./images/logo.webp" type="image/x-icon">
  </head>
  <body>
    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 25px 80px;
            border-bottom: 2px solid #ccc;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
        }

        a {
            text-decoration: none;
            color: rgb(17, 17, 17);
            transition: ease-in;
            transition-duration: 0.2s;
        }

        a:hover {
            color: #fdc332;
            transition: ease-out;
            transition-duration: 0.2s;
        }

        nav {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        .nav-button {
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .login-button {
            border: 1px solid #dee2e6;
            color: #fdc332;
            margin-right: -20px;
        }

        .login-button:hover {
            color: white;
            background-color: #fdc332;

        }

        .register-button {
            background-color: #fdc332;
            color: white;
        }

        .register-button:hover {
            color: white;
        }

        .nav-menu-button {
            display: none;
            flex-direction: column;
            gap: 5px;
        }
        
        .dash {
            height: 2px;
            width: 18px;
            background-color: black;
        }

        @media screen and (max-width: 425px) {
            nav {
                display: flex;
                position: absolute;
                top: 60px;
                flex-direction: column;
                align-items: start;
            }

            .nav-menu-button {
                display: flex;
            }

            header {
                padding: 8px 20px;
            }
        }

    </style>

    <header>
        <div class="logo"><img src="./images/logo.webp"> ExpertHub</div>


        <div class="nav-menu-button">
            <div class="dash"></div>
            <div class="dash"></div>
            <div class="dash"></div>
        </div>

        <nav>
            <a href="#">Services</a>
            <a href="#">Find Experts</a>
            <a href="#">Workspaces</a>
            <a href="#">Trainings</a>
            <a href="#">Events</a>
            <a href="#">Contact</a>
            <a href="#" class="nav-button login-button">Login</a>
            <a href="#" class="nav-button register-button">Register</a>
        </nav>
    </header>

    <script>
        const menuNavButton = document.querySelector(".nav-menu-button");
        const nav = document.querySelector("nav");
        menuNavButton.addEventListener("click", doSomething);

        function doSomething () {
            if(nav.style.display == "flex") {
                nav.style.display = "none";
            } else {
                nav.style.display = "flex";
            }
        }
    </script>

  </body>
</html>
