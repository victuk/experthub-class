<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="file-input" style="background-color: blue; color: white;">Change image</label>
        <input type="file" id="file-input">
    </form>
    <script>
        const color = document.querySelector("#color");
        color.addEventListener("click", (e) => {
            document.querySelector("#login").style.backgroundColor = e.target.value;
        });
    </script>
</body>
</html>
